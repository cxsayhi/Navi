spring:
  application:
    name: wanderline-api
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${WANDERLINE_DB_URL:jdbc:postgresql://localhost:5432/wanderline}
    username: ${WANDERLINE_DB_USERNAME:wanderline}
    password: ${WANDERLINE_DB_PASSWORD:wanderline-local}
    hikari:
      maximum-pool-size: ${WANDERLINE_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${WANDERLINE_DB_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${WANDERLINE_SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

app:
  cors:
    allowed-origins: ${WANDERLINE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
  google-maps:
    server-api-key: ${GOOGLE_MAPS_SERVER_API_KEY:}
    request-timeout: ${WANDERLINE_MAP_REQUEST_TIMEOUT:PT12S}

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-none}]"

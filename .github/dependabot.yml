version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: &weekly
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3

  - package-ecosystem: maven
    directory: /backend
    schedule: *weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /
    schedule: *weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /backend
    schedule: *weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /frontend
    schedule: *weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule: *weekly
    open-pull-requests-limit: 3
